name: Validate Caddyfile

on:
  push:
  pull_request:

jobs:
  validate:
    name: Caddy Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e DOMAIN=example.com \
            -v $PWD/Caddyfile:/etc/caddy/Caddyfile:ro \
            caddy:latest \
            caddy validate --config /etc/caddy/Caddyfile
